<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A wordless encounter with completion before entering the Completed Intelligibility site.">
  <meta name="theme-color" content="#05080d">
  <title>Completed Intelligibility — Wordless</title>
  <link rel="stylesheet" href="wordless.css">
</head>
<body class="wordless-entry">
  <main class="wordless-stage" aria-label="Wordless completion experience">
    <iframe
      class="wordless-runtime"
      src="theorem_zero_runtime_endless_blend.html"
      title="Theorem Zero endless lawful emergence runtime"
      loading="eager"
      allow="fullscreen"
    ></iframe>

    <span class="wordless-enter-pulse" aria-hidden="true"></span>
    <a class="wordless-enter" href="home.html" aria-label="Enter the site" title="Enter the site">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h13"></path>
        <path d="m14 7 5 5-5 5"></path>
      </svg>
    </a>
  </main>

  <script>
    (() => {
      const key = "completed-intelligibility-wordless-return";
      const enter = document.querySelector(".wordless-enter");
      let state = null;

      try {
        state = JSON.parse(sessionStorage.getItem(key) || "null");
      } catch (_) {
        state = null;
      }

      if (state?.href) {
        enter.href = state.href;
        enter.dataset.returning = "true";
        enter.setAttribute("aria-label", "Return to your reading position");
        enter.title = "Return to your reading position";
      }

      enter.addEventListener("click", () => {
        if (!state?.href) return;
        sessionStorage.setItem(key, JSON.stringify({ ...state, returning: true }));
      });
    })();
  </script>
</body>
</html>
